plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id 'idea'
    id 'java-library'
}

repositories {
    maven { url 'https://maven.parchmentmc.org' }
    maven { url = 'https://maven.ryanhcode.dev/releases' }
    maven { url 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        if (project.hasProperty('parchment_minecraft_version') && project.hasProperty('parchment_mappings_version')) {
            def mcVer = project.parchment_minecraft_version
            def mapVer = project.parchment_mappings_version

            if (mcVer != null && mapVer != null && !mcVer.isBlank() && !mapVer.isBlank()) {
                parchment("org.parchmentmc.data:parchment-${mcVer}:${mapVer}@zip")
            }
        }
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modCompileOnly("dev.ryanhcode.sable:sable-fabric-${minecraft_version}:${sable_version}") {
        transitive = false
    }
    compileOnly "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}"

    include(implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:${mixinsquared_version}")))
    modImplementation 'com.electronwill.night-config:toml:3.8.1'
    include "com.electronwill.night-config:toml:3.8.1"
    include "com.electronwill.night-config:core:3.8.1"
    compileOnly 'org.projectlombok:lombok:1.18.44'
    annotationProcessor 'org.projectlombok:lombok:1.18.44'
    implementation include(project(":api"))

    implementation "maven.modrinth:lithium:${lithium_version}-neoforge"
    modImplementation(include("me.lucko:fabric-permissions-api:${project.permission_api}"))
}

loom {
    mixin.useLegacyMixinAp = true
    def aw = project(':common').file("src/main/resources/async.accesswidener")
    accessWidenerPath.set(project(":common").file("src/main/resources/async.accesswidener"))
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("async.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
            vmArgs(
                    "-Xms512m",
                    "-Xmx1536m"
            )
        }
    }
}
