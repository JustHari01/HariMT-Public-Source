plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'idea'
}

repositories {
    maven { url = 'https://maven.ryanhcode.dev/releases' }
    maven { url 'https://api.modrinth.com/maven' }
}

evaluationDependsOn(':api')
neoForge {
    version = neoforge_version
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        create("client") {
            client()
        }
        create("server") {
            server()
        }
    }
    mods {
        create("${mod_id}") {
            sourceSet sourceSets.main
            sourceSet project(':api').sourceSets.main
        }
    }
}

dependencies {
    compileOnly(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:${mixinsquared_version}"))
    implementation(jarJar("com.github.bawnorton.mixinsquared:mixinsquared-neoforge:${mixinsquared_version}"))
    implementation "maven.modrinth:lithium:${lithium_version}-neoforge"
    compileOnly("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") {
        transitive = false
    }
    compileOnly "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}"
    compileOnly 'org.projectlombok:lombok:1.18.44'
    annotationProcessor 'org.projectlombok:lombok:1.18.44'
    implementation project(':api')
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.named('jar', Jar) {
    dependsOn project(':api').tasks.named('classes')
    from(project(':api').sourceSets.main.output)
}
